# Screwhead Networks -- TLS, with a client-certificate gate on /admin-panel/.
#
# This file is the actual access control for the admin panel. The login page in
# the site is decoration and enforces nothing; a check that runs in the
# visitor's browser is not a check. Everything below runs on the server, before
# a single byte of the admin panel is sent.
#
# The public pages stay open to everyone. Only /admin-panel/ demands a client
# certificate signed by the Screwhead Networks root CA.
#
# See deploy/README.md for creating the CA, issuing client certificates, and
# verifying that the gate actually works.
#
# NOTE: limit_req_zone belongs in the http { } block, not here. Put this line
# in nginx.conf alongside the other http-level directives:
#
#     limit_req_zone $binary_remote_addr zone=noclogin:10m rate=5r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name screwheadnetworks.com www.screwheadnetworks.com;
    return 301  https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name screwheadnetworks.com www.screwheadnetworks.com;

    # nginx 1.25.1 and newer. On older builds delete this and write the listen
    # directives above as: listen 443 ssl http2;
    http2 on;

    ssl_certificate     /etc/ssl/screwhead/server.crt;
    ssl_certificate_key /etc/ssl/screwhead/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Ask every client for a certificate but do not insist on one, so the
    # public site still loads in an ordinary browser with no certificate
    # installed. Enforcement happens per location, below.
    ssl_client_certificate /etc/ssl/screwhead/root-ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    root  /var/www/screwhead;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The gate. $ssl_client_verify is SUCCESS only when the client presented a
    # certificate that chains to root-ca.crt and is currently valid. Anything
    # else -- no certificate, expired, self-signed, signed by some other CA --
    # gets a 403 and never sees the page.
    location /admin-panel/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        try_files $uri $uri/ =404;
    }

    # The login endpoint.
    #
    # This is what makes an attempted login go nowhere. A request without a
    # verified client certificate is refused here, by nginx, before it is
    # proxied anywhere -- the backend never sees the username or password, and
    # never runs a line of code on their behalf. The rate limit is what stops
    # someone hammering it: refusing a request is cheap, but not free.
    #
    # X-SSL-Client-Verify is passed through so the backend can make the same
    # check again, in case it is ever reachable without nginx in front.
    location = /login {
        limit_req zone=noclogin burst=3 nodelay;

        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        proxy_pass       http://127.0.0.1:8090/login;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    }

    # The traffic map's feed, served by backend/noc_bridge.py. CheerpJ only
    # allows the applet same-origin requests, so this has to live on this host,
    # port and scheme rather than the applet calling LibreNMS directly.
    #
    # Read the note at the end of deploy/README.md before enabling this: the
    # Layout page is public, so whatever is served here is public too.
    location = /status.json {
        proxy_pass       http://127.0.0.1:8090/status.json;
        proxy_set_header Host $host;
        add_header       Cache-Control "no-store";
    }
}
